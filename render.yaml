services:
  - type: web
    name: locphats
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DNSE_API_KEY
        sync: false
      - key: DNSE_API_SECRET
        sync: false
      - key: DNSE_BOARD_ID
        value: G1
      - key: VNSTOCK_API_KEY
        sync: false
      - key: VNAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: locphats-rrg
          property: connectionString
      - key: RRG_DATA_V2_ENABLED
        value: "true"

databases:
  - name: locphats-rrg
    plan: basic-256mb
    databaseName: locphats_rrg
    user: locphats_rrg
