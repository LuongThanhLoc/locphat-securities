services:
  - type: web
    name: locphats
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DNSE_API_KEY
        sync: false
      - key: DNSE_API_SECRET
        sync: false
      - key: DNSE_BOARD_ID
        value: G1
      - key: VNSTOCK_API_KEY
        sync: false
      - key: VNAI_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: BLS_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: locphats-rrg
          property: connectionString
      - key: RRG_DATA_V2_ENABLED
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: AUTH_RATE_LIMIT_SECRET
        generateValue: true

  - type: cron
    name: locphats-rrg-sync
    runtime: python
    schedule: "30 8 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python rrg_sync.py backfill
    envVars:
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: DATABASE_URL
        fromDatabase:
          name: locphats-rrg
          property: connectionString
      - key: VNSTOCK_API_KEY
        sync: false
      - key: VNAI_API_KEY
        sync: false

databases:
  - name: locphats-rrg
    plan: basic-256mb
    databaseName: locphats_rrg
    user: locphats_rrg
