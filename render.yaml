services:
  - type: web
    name: locphats
    runtime: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DNSE_API_KEY
        sync: false
      - key: DNSE_API_SECRET
        sync: false
      - key: DNSE_BOARD_ID
        value: G1
      - key: VNSTOCK_API_KEY
        sync: false
      - key: VNAI_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: BLS_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: locphats-rrg
          property: connectionString
      - key: VOLUME_FLOW_DATABASE_URL
        fromDatabase:
          name: locphats-rrg
          property: connectionString
      - key: RRG_DATA_V2_ENABLED
        value: "false"

databases:
  - name: locphats-rrg
    # Free is deliberate for this personal deployment. Render Free Postgres
    # expires after 30 days; do not silently promote this to a paid plan.
    plan: free
    region: singapore
    databaseName: locphats_rrg
    user: locphats_rrg
